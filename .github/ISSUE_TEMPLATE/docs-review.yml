name: Question or suggestion
description: Ask about the plan or suggest a change. Use the existing discussion when possible.
body:
  - type: input
    id: page
    attributes:
      label: Which page is this about?
      placeholder: Paste the page link here.
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to ask or change?
      placeholder: Explain your idea in your own words.
    validations:
      required: true
