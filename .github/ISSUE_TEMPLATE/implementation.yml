name: Build a feature
description: Plan one coding task after we agree on the website plan.
body:
  - type: input
    id: plan
    attributes:
      label: Link to the checklist section
      placeholder: For example, Choose a shirt (CART-01).
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What should we build?
      description: Describe what the visitor should be able to do.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How will we check it works?
      description: List a few actions to try and what should happen.
    validations:
      required: true
